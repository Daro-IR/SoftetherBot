<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://telegram.org/js/telegram-web-app.js"></script><title>SoftetherBot · Game Server Hub</title><style>body{font-family:system-ui;margin:0;background:#0e1621;color:#eef3f7}.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.title{font-size:24px;font-weight:800}.muted{color:#9fb0c0}.tabs{display:flex;gap:8px;overflow:auto;margin:18px 0}.tab,.btn{border:0;border-radius:10px;padding:10px 14px;background:#243447;color:#fff;cursor:pointer}.tab.active{background:#4d87c7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.card{background:#172333;border:1px solid #2a3b4d;border-radius:14px;padding:15px}.pill{display:inline-block;background:#223246;padding:6px 9px;border-radius:99px;margin:4px}.badge{font-size:12px;background:#2a4057;border-radius:99px;padding:4px 8px;margin-right:5px}.btn.danger{background:#7b3030}.btn.ok{background:#2d6a4f}.field{width:100%;box-sizing:border-box;padding:11px;border-radius:9px;border:1px solid #38506a;background:#0f1a26;color:#fff;margin:8px 0}.hidden{display:none}.log{white-space:pre-wrap;background:#091019;padding:10px;border-radius:9px;max-height:360px;overflow:auto}.bar{height:12px;background:#263849;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#61a8e5}.step{padding:10px;border-left:3px solid #38506a;margin:7px 0;background:#14202d}.step.on{border-left-color:#65b88a}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:7px;border-bottom:1px solid #2a3b4d;font-size:13px}</style></head><body><div class="wrap"><div class="top"><div><div class="title">🎮 SoftetherBot</div><div class="muted">Game Server Hub · administración real del VPS</div></div><button class="btn" onclick="loadAll()">↻</button></div><div id="res"></div><div class="tabs"><button class="tab active" onclick="tab('games',this)">🎮 Juegos</button><button class="tab" onclick="tab('diag',this)">🩺 Diagnóstico</button><button class="tab" onclick="tab('jobs',this)">⚙️ Trabajos</button><button class="tab" onclick="tab('backup',this)">💾 Backups</button><button class="tab" onclick="tab('setup',this)">🧭 Asistente</button></div><section id="games"></section><section id="diag" class="hidden"></section><section id="jobs" class="hidden"></section><section id="backup" class="hidden"></section><section id="setup" class="hidden"></section></div><div id="modal" class="hidden"></div><script>
const tg=window.Telegram.WebApp;tg.ready();tg.expand();const H={'X-Telegram-Init-Data':tg.initData};let games=[],servers=[];const $=x=>document.getElementById(x);const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(u,o={}){o.headers={...(o.headers||{}),...H,'Content-Type':'application/json'};let r=await fetch(u,o),j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j.error||j.message||'HTTP '+r.status);return j}
function tab(id,b){document.querySelectorAll('section').forEach(s=>s.classList.add('hidden'));$(id).classList.remove('hidden');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(id==='diag')diag();if(id==='jobs')jobs();if(id==='backup')backups();if(id==='setup')setup();}
function resources(r){$('res').innerHTML=`<span class=pill>🧠 RAM <b>${r.ram_available_mb} MB</b></span><span class=pill>💾 Disco <b>${r.disk_free_mb} MB</b></span><span class=pill>⚙️ CPU <b>${r.running_cpu_weight}/${r.cpu_count}</b></span><span class=pill>📈 carga ${r.load1}</span>`}
function serverCard(s){return `<div class=card><b>${esc(s.name)}</b><div class=muted>${esc(s.game_name)} · ${esc(s.status)} · puerto ${s.game_port||'-'}</div><div class=actions><button class="btn ok" onclick="ctl('${esc(s.name)}','start')">▶</button><button class=btn onclick="ctl('${esc(s.name)}','restart')">↻</button><button class=btn onclick="ctl('${esc(s.name)}','stop')">■</button><button class=btn onclick="adm('${esc(s.name)}')">🔐 Administración</button><button class=btn onclick="upd('${esc(s.name)}')">⬆️ Actualizar</button><button class="btn danger" onclick="uninstall('${esc(s.name)}')">🗑</button></div></div>`}
function render(){ $('games').innerHTML='<div class=grid>'+games.map(g=>`<article class=card><h3>${esc(g.name)}</h3><span class=badge>${esc(g.provider_label||g.method)}</span><span class=badge>${esc(g.category)}</span><p class=muted>${esc(g.notes||'')}</p><table><tr><th>Servidor</th><td>${esc(g.server_app_id||'-')}</td></tr><tr><th>Juego</th><td>${esc(g.game_id||'-')}</td></tr><tr><th>RAM</th><td>${g.ram_mb} MB</td></tr><tr><th>Disco</th><td>${g.disk_mb} MB</td></tr><tr><th>CPU</th><td>${g.cpu_weight}</td></tr><tr><th>Puerto</th><td>${g.default_port}</td></tr><tr><th>Administración</th><td>${esc(g.admin_password_label||'Administración')}</td></tr><tr><th>Actualización</th><td>${esc(g.update_method||'-')}</td></tr></table><div class=actions><button class=btn onclick="install('${g.key}')">🚀 Instalar</button></div>${servers.filter(s=>s.game_key===g.key).map(serverCard).join('')}</article>`).join('')+'</div>'}
async function install(k){let g=games.find(x=>x.key===k);try{let c=await api('/api/resources/check',{method:'POST',body:JSON.stringify({game_key:k})});if(!c.ok){alert(c.message);return}let name=prompt('Nombre de la instancia',k);if(!name)return;let j=await api('/api/install',{method:'POST',body:JSON.stringify({game_key:k,name})});poll(j.job_id)}catch(e){alert('⛔ '+e.message)}}
async function poll(id){let timer=setInterval(async()=>{try{let j=(await api('/api/jobs/'+id)).job;let pct=j.progress||0;document.title=`SoftetherBot · ${pct}%`;if(j.status==='completed'||j.status==='failed'){clearInterval(timer);alert(j.status==='completed'?'✅ Instalación completada':'⛔ '+(j.error_message||j.message));await loadAll()}}catch(e){clearInterval(timer)}},800);alert('Trabajo creado. Puedes seguir el progreso en la pestaña ⚙️ Trabajos.')}
async function ctl(n,a){try{await api('/api/control',{method:'POST',body:JSON.stringify({name:n,action:a})});loadAll()}catch(e){alert(e.message)}}async function uninstall(n){if(confirm('Eliminar '+n+' y sus archivos?'))ctl(n,'uninstall')}
async function adm(n){let p=prompt('Nueva contraseña (vacío = generar automáticamente)');try{let j=await api('/api/rcon/regenerate',{method:'POST',body:JSON.stringify({name:n,password:p||null})});alert('Guárdala ahora:\n'+j.admin_password)}catch(e){alert(e.message)}}
async function upd(n){if(!confirm('Se hará backup antes de actualizar. Continuar?'))return;try{let j=await api('/api/update',{method:'POST',body:JSON.stringify({name:n})});alert('Actualizado. Backup: '+j.backup.name);loadAll()}catch(e){alert('⛔ '+e.message)}}
async function diag(){try{let d=await api('/api/diagnostics');$('diag').innerHTML=`<div class=grid><article class=card><h2>🩺 Salud</h2><pre class=log>${esc(JSON.stringify(d.health,null,2))}</pre></article><article class=card><h2>📊 Recursos</h2><pre class=log>${esc(JSON.stringify(d.resources,null,2))}</pre></article><article class=card><h2>🎮 Servidores</h2><pre class=log>${esc(JSON.stringify(d.servers,null,2))}</pre></article><article class=card><h2>📋 Auditoría</h2><pre class=log>${esc(JSON.stringify(d.audit,null,2))}</pre></article></div>`}catch(e){$('diag').innerHTML='<article class=card>⛔ '+esc(e.message)+'</article>'}}
async function jobs(){try{let j=(await api('/api/diagnostics')).jobs;$('jobs').innerHTML='<article class=card><h2>⚙️ Trabajos</h2><table><tr><th>Job</th><th>Juego</th><th>Estado</th><th>Progreso</th><th>Mensaje</th></tr>'+j.map(x=>`<tr><td>${esc(x.job_id.slice(0,10))}</td><td>${esc(x.game_key)}</td><td>${esc(x.status)}</td><td>${x.progress}%</td><td>${esc(x.message||'')}</td></tr>`).join('')+'</table></article>'}catch(e){$('jobs').innerHTML='<article class=card>⛔ '+esc(e.message)+'</article>'}}
async function backups(){try{let b=(await api('/api/diagnostics')).backups;$('backup').innerHTML=`<article class=card><h2>💾 Backups</h2><p class=muted>Se guardan localmente y pueden enviarse al Telegram del administrador.</p><button class=btn onclick="makeBackup()">Crear backup ahora</button><table><tr><th>Nombre</th><th>Tamaño</th><th>Fecha</th><th>Estado</th></tr>${b.map(x=>`<tr><td>${esc(x.backup_name)}</td><td>${Math.round(x.size_bytes/1024)} KB</td><td>${esc(x.created_at)}</td><td>${esc(x.status)}</td></tr>`).join('')}</table></article>`}catch(e){$('backup').innerHTML='<article class=card>⛔ '+esc(e.message)+'</article>'}}
async function makeBackup(){try{let x=await api('/api/backup',{method:'POST',body:'{}'});alert('Backup: '+x.name+' · Telegram: '+x.telegram);backups()}catch(e){alert(e.message)}}
function setup(){ $('setup').innerHTML=`<article class=card><h2>🧭 Instalador SoftetherBot · estilo Jellyfin</h2><p class=muted>Asistente de 8 pasos. La instalación normal conserva el control por root y verifica cada etapa antes de finalizar.</p>${['1 · Bienvenida y comprobación del VPS','2 · Datos del servidor','3 · Red VPN y puerto','4 · SoftEther VPN','5 · DHCP/TAP y firewall','6 · Telegram y administración','7 · Game Server Hub / Insurgency','8 · Verificación final y activación'].map((x,i)=>`<div class="step ${i===0?'on':''}">${x}</div>`).join('')}<p class=muted>Las acciones destructivas y las credenciales administrativas requieren confirmación. El instalador no abre el puerto JSON-RPC de SoftEther.</p></article>`}
async function loadAll(){try{let[g,s]=await Promise.all([api('/api/games'),api('/api/status')]);games=g.games;servers=s.servers;resources(s.resources);render()}catch(e){$('games').innerHTML='<article class=card>⛔ '+esc(e.message)+'</article>'}}loadAll();
</script></body></html>
